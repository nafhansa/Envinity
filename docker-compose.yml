# Local development database. Port 5434 so it can run next to Securinity's (5433).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: envinity
      POSTGRES_PASSWORD: envinity_dev_password
      POSTGRES_DB: envinity
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - envinity_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U envinity -d envinity']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  envinity_pg:
